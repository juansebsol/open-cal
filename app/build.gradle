plugins { id 'com.android.application' }

android {
    namespace 'dev.opencal.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.opencal.tv'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // Sideload builds only; use a real release key before distributing
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
