plugins { id 'com.android.application' }

android {
    namespace 'dev.roomcalendar.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.roomcalendar.tv'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // Local test APK; replace with release key before distribution
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
